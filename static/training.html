<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RF Training Monitor</title>
<style>
  :root { --bg: #0d1117; --card: #161b22; --border: #30363d; --text: #c9d1d9;
          --dim: #8b949e; --green: #3fb950; --yellow: #d29922; --red: #f85149;
          --blue: #58a6ff; --purple: #bc8cff; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace; background: var(--bg);
         color: var(--text); padding: 20px; line-height: 1.5; }
  h1 { font-size: 18px; color: var(--blue); margin-bottom: 4px; }
  .subtitle { color: var(--dim); font-size: 12px; margin-bottom: 16px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 12px; }
  .card .label { font-size: 11px; color: var(--dim); text-transform: uppercase; letter-spacing: 0.5px; }
  .card .value { font-size: 22px; font-weight: bold; margin-top: 2px; }
  .card .detail { font-size: 11px; color: var(--dim); margin-top: 2px; }
  .status-running { color: var(--green); }
  .status-stopped { color: var(--red); }
  .status-improving { color: var(--green); }
  .status-plateau { color: var(--yellow); }
  .status-declining { color: var(--yellow); }
  .status-degrading { color: var(--red); }
  .status-converged { color: var(--purple); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; color: var(--dim); font-size: 11px; text-transform: uppercase;
       letter-spacing: 0.5px; padding: 6px 10px; border-bottom: 1px solid var(--border); }
  td { padding: 5px 10px; border-bottom: 1px solid #21262d; }
  tr:hover td { background: #1c2128; }
  tr.best td { color: var(--green); font-weight: bold; }
  tr.trough td { color: var(--yellow); }
  tr.new-class td { color: var(--purple); }
  .annotation { font-size: 11px; color: var(--dim); margin-left: 6px; }
  .section { margin-bottom: 20px; }
  .section-title { font-size: 14px; color: var(--blue); margin-bottom: 8px;
                   border-bottom: 1px solid var(--border); padding-bottom: 4px; }
  .chart-container { background: var(--card); border: 1px solid var(--border);
                     border-radius: 8px; padding: 16px; margin-bottom: 20px; height: 260px; position: relative; }
  canvas { width: 100% !important; height: 100% !important; }
  .poll-info { position: fixed; bottom: 12px; right: 16px; font-size: 11px; color: var(--dim);
               background: var(--card); border: 1px solid var(--border); border-radius: 6px; padding: 4px 10px; }
  .bar { height: 6px; border-radius: 3px; background: var(--border); margin-top: 4px; }
  .bar-fill { height: 100%; border-radius: 3px; background: var(--green); transition: width 0.5s; }
  .live-log { font-size: 12px; color: var(--dim); padding: 8px 12px; background: var(--card);
              border: 1px solid var(--border); border-radius: 8px; white-space: pre-wrap; max-height: 60px; overflow: hidden; }
  .oob-bar { display: inline-block; height: 14px; border-radius: 2px; vertical-align: middle; margin-right: 4px; }
  tr.curve-row { cursor: pointer; }
  tr.curve-row:hover td { background: #1c2128; }
  tr.curve-row.expanded td { border-bottom-color: var(--blue); }
  tr.detail-row td { padding: 0; background: var(--bg); border-bottom: 2px solid var(--border); }
  .dp { padding: 10px 12px; font-size: 12px; line-height: 1.6; }
  .dp .dp-meta { color: var(--dim); margin-bottom: 8px; }
  .dp .dp-meta b { color: var(--text); }
  .dp .dp-section { color: var(--dim); font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; margin: 10px 0 4px; }
  .dp .dp-section:first-of-type { margin-top: 0; }
  .dp .tags { display: flex; flex-wrap: wrap; gap: 4px; }
  .dp .tag { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px;
             border-radius: 4px; font-size: 11px; border: 1px solid var(--border); background: var(--card); white-space: nowrap; }
  .dp .tag .tv { font-weight: bold; }
  .dp .tag.t-great { border-color: #23492e; color: var(--green); }
  .dp .tag.t-good  { border-color: #1a3a52; color: var(--blue); }
  .dp .tag.t-ok    { border-color: #3d3019; color: var(--yellow); }
  .dp .tag.t-poor  { border-color: #3d1f1f; color: var(--red); }
  .dp .tag.t-miss  { border-color: var(--border); color: #484f58; font-style: italic; }
  .dp .imps { color: var(--dim); font-size: 11px; line-height: 1.8; }
  .dp .imps .fi { color: var(--text); }
  .dp .imps .fv { font-size: 10px; }
  .not-evaluated { color: var(--dim); font-style: italic; font-size: 12px; padding: 8px 12px; }
  .modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.6); z-index:100; align-items:center; justify-content:center; }
  .modal-overlay.open { display:flex; }
  .modal { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:20px; max-width:640px; width:90vw; max-height:85vh; overflow-y:auto; position:relative; }
  .modal-close { position:absolute; top:8px; right:12px; background:none; border:none; color:var(--dim); font-size:18px; cursor:pointer; }
  .modal-close:hover { color:var(--text); }
  .modal h2 { font-size:15px; color:var(--blue); margin-bottom:4px; }
  .modal .modal-sub { font-size:11px; color:var(--dim); margin-bottom:12px; }
  @media (max-width: 600px) { body { padding: 10px; } .grid { grid-template-columns: 1fr 1fr; } }
</style>
</head>
<body>

<div style="display:flex;align-items:baseline;gap:16px">
  <h1>🌲 RF Training Monitor</h1>
  <span style="font-size:11px;display:flex;gap:10px">
    <a href="/" style="color:var(--dim);text-decoration:none">← app</a>
    <a href="/docs" style="color:var(--dim);text-decoration:none">docs</a>
    <a href="/api/v1/training/status" style="color:var(--dim);text-decoration:none">api</a>
  </span>
</div>
<div class="subtitle">Auto-refreshes every 15s · <span id="lastUpdate">—</span> · Next curve eval: <span id="nextCron">—</span> · <a href="#" id="triggerEval" style="color:var(--blue);text-decoration:none" onclick="triggerEval(event)">trigger now</a><a href="#" id="stopEval" style="color:var(--red);text-decoration:none;display:none" onclick="stopEval(event)"> · stop</a></div>

<div class="grid" id="cards"></div>

<div class="section">
  <div class="section-title">OOB Learning Curve</div>
  <div class="chart-container"><canvas id="chart"></canvas></div>
</div>

<div class="section">
  <div class="section-title">Checkpoint History</div>
  <div class="card" style="overflow-x:auto; padding:0">
    <table id="curveTable">
      <thead><tr><th>KGs</th><th>Samples</th><th>Classes</th><th>OOB</th><th></th><th></th></tr></thead>
      <tbody></tbody>
    </table>
  </div>
</div>

<div class="section" id="historySection" style="display:none">
  <div class="section-title">Live Model History (cron)</div>
  <div class="card" style="overflow-x:auto; padding:0">
    <table id="histTable">
      <thead><tr><th>Time</th><th>KGs</th><th>OOB</th><th>Δ</th><th>Avg5</th><th>Status</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>
</div>

<div class="modal-overlay" id="deployedModal" onclick="if(event.target===this)this.classList.remove('open')">
  <div class="modal">
    <button class="modal-close" onclick="document.getElementById('deployedModal').classList.remove('open')">&times;</button>
    <h2>⭐ Deployed Model</h2>
    <div class="modal-sub" id="deployedModalSub"></div>
    <div id="deployedModalBody" class="dp"></div>
  </div>
</div>

<div class="poll-info">Polling <span id="pollCountdown">15</span>s</div>

<script>
const API = '/api/v1/training/status';
let chart = null;
let countdown = 15;

function fmt(n) { return n != null ? n.toLocaleString() : '—'; }
function pct(v, d=2) { return v != null ? (v * 100).toFixed(d) + '%' : '—'; }

// Best from checkpoint curve: uses composite score (mature class count only)
let _bestFromCurve = {oob: null, composite: null, kgs: null};
let _deployedModel = {n_kgs: null, best_seed: null, composite: null};
let _deployedDetail = null;
function computeBestFromCurve(curve) {
  if (!curve || !curve.length) return;
  const maxCls = Math.max(...curve.map(r => r.n_classes || 0));
  let best = {oob: null, composite: null, kgs: null, mean_cls: null, min_cls: null};
  curve.forEach(r => {
    if ((r.n_classes || 0) < maxCls) return;
    const comp = r.composite_median ?? r.oob_median ?? r.oob ?? 0;
    if (best.composite === null || comp > best.composite) {
      best.composite = comp;
      best.oob = r.oob_median ?? r.oob ?? 0;
      best.kgs = r.n_kgs;
      best.mean_cls = r.mean_class_median ?? null;
      best.min_cls = r.min_class_median ?? null;
    }
  });
  _bestFromCurve = best;
}

function renderCards(d) {
  const running = d.running;
  const m = d.model || {};
  const mon = d.monitor || {};
  const statusCls = mon.last_status ? 'status-' + mon.last_status : '';

  let html = '';
  // Service status
  html += `<div class="card">
    <div class="label">Service</div>
    <div class="value ${running ? 'status-running' : 'status-stopped'}">${running ? '● Running' : '○ Stopped'}</div>
    <div class="detail">${d.service_state || '—'}${d.ram_mb ? ' · ' + d.ram_mb + ' MB' : ''}</div>
  </div>`;

  // Progress — use n_checkpoints (successful KGs) like the main app does
  const nDone = d.n_checkpoints || 0;
  const nTotal = d.current_kg ? d.current_kg.total : 4000;
  const nFail = d.n_failed_kgs || 0;
  const failPart = nFail > 0 ? `; ${nFail} fail` : '';
  const toNext = d.to_next_model;
  const cpPart = (typeof toNext === 'number' && toNext > 0) ? `; ${toNext} to cp ${d.next_model_checkpoint}` : '';
  const pctDoneReal = nTotal > 0 ? (nDone / nTotal * 100).toFixed(1) : 0;
  const kgInfo = d.current_kg ? d.current_kg.kg_name + ' (' + d.current_kg.kg_code + ')' : '—';
  const stepInfo = d.current_step ? d.current_step : '';
  html += `<div class="card">
    <div class="label">Progress</div>
    <div class="value">${nDone}/${nTotal}</div>
    <div class="bar"><div class="bar-fill" style="width:${pctDoneReal}%"></div></div>
    <div class="detail">${kgInfo}${failPart}${cpPart}</div>
    ${stepInfo ? '<div class="detail" style="margin-top:4px;font-size:10px;opacity:0.7;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + stepInfo + '</div>' : ''}
  </div>`;

  // Current OOB
  html += `<div class="card">
    <div class="label">Current OOB</div>
    <div class="value">${m.oob_score ? (m.oob_score * 100).toFixed(2) + '%' : '—'}</div>
    <div class="detail">${fmt(m.n_train)} samples · ${m.n_classes || '—'} classes</div>
  </div>`;

  // Best (mature) — uses composite score from checkpoint curve
  const bestCurve = _bestFromCurve;
  const bestComp = bestCurve.composite;
  const bestOob = bestCurve.oob || mon.mature_peak_oob || mon.best_oob;
  const bestKgs = bestCurve.kgs || mon.mature_peak_n_kgs || mon.best_n_kgs;
  const kgsSincePeak = bestKgs && mon.last_n_kgs ? mon.last_n_kgs - bestKgs : mon.kgs_since_peak;
  const meanClsStr = bestCurve.mean_cls ? ` · avg ${(bestCurve.mean_cls * 100).toFixed(1)}%` : '';
  const minClsStr = bestCurve.min_cls ? ` · worst ${(bestCurve.min_cls * 100).toFixed(1)}%` : '';
  html += `<div class="card">
    <div class="label">Best Composite (mature)</div>
    <div class="value status-improving">${bestComp ? (bestComp * 100).toFixed(2) + '%' : bestOob ? (bestOob * 100).toFixed(2) + '%' : '—'}</div>
    <div class="detail">OOB ${bestOob ? (bestOob * 100).toFixed(2) + '%' : '—'} at ${bestKgs || '—'} KGs${meanClsStr}${minClsStr}</div>
  </div>`;

  // Monitor status
  html += `<div class="card">
    <div class="label">Trend</div>
    <div class="value ${statusCls}">${mon.last_status || '—'}</div>
    <div class="detail">${mon.should_stop ? '⚠️ Recommend stop' : 'Keep training'}</div>
  </div>`;

  // Checkpoints
  html += `<div class="card">
    <div class="label">Checkpoints</div>
    <div class="value">${d.n_checkpoints || '—'}</div>
    <div class="detail">Next model in ${d.to_next_model || '—'} KGs${d.n_failed_kgs ? ' · ' + d.n_failed_kgs + ' failed' : ''}</div>
  </div>`;

  document.getElementById('cards').innerHTML = html;
}

function renderChart(curve) {
  if (!curve || curve.length === 0) return;
  const canvas = document.getElementById('chart');
  const ctx = canvas.getContext('2d');
  const W = canvas.parentElement.clientWidth - 32;
  const H = canvas.parentElement.clientHeight - 32;
  canvas.width = W * 2; canvas.height = H * 2;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  ctx.scale(2, 2);

  // Data arrays
  const compMeds = curve.map(r => r.composite_median ?? r.oob_median ?? r.oob ?? 0);
  const compMins = curve.map(r => r.composite_min ?? r.composite_median ?? compMeds[0]);
  const compMaxs = curve.map(r => r.composite_max ?? r.composite_median ?? compMeds[0]);
  const oobMeds = curve.map(r => r.oob_median ?? r.oob ?? 0);
  const oobMins = curve.map(r => r.oob_min ?? oobMeds[0]);
  const oobMaxs = curve.map(r => r.oob_max ?? oobMeds[0]);
  const kgs = curve.map(r => r.n_kgs);
  const hasSpread = curve.some(r => (r.n_seeds || 1) > 1);

  // Y-axis scale: encompass both metrics with all seed spread
  const allVals = [...compMins, ...compMaxs, ...oobMins, ...oobMaxs];
  const minVal = Math.floor(Math.min(...allVals) * 1000) / 1000 - 0.01;
  const maxVal = Math.ceil(Math.max(...allVals) * 1000) / 1000 + 0.01;
  const pad = { top: 10, right: 20, bottom: 30, left: 50 };
  const cw = W - pad.left - pad.right;
  const ch = H - pad.top - pad.bottom;

  function x(i) { return pad.left + (i / Math.max(1, curve.length - 1)) * cw; }
  function y(v) { return pad.top + (1 - (v - minVal) / (maxVal - minVal)) * ch; }

  // Grid
  ctx.strokeStyle = '#21262d'; ctx.lineWidth = 0.5;
  for (let i = 0; i <= 6; i++) {
    const v = minVal + (maxVal - minVal) * (i / 6);
    const yy = y(v);
    ctx.beginPath(); ctx.moveTo(pad.left, yy); ctx.lineTo(W - pad.right, yy); ctx.stroke();
    ctx.fillStyle = '#8b949e'; ctx.font = '10px monospace'; ctx.textAlign = 'right';
    ctx.fillText((v * 100).toFixed(1) + '%', pad.left - 4, yy + 3);
  }
  ctx.textAlign = 'center';
  for (let i = 0; i < curve.length; i += Math.max(1, Math.floor(curve.length / 10))) {
    ctx.fillStyle = '#8b949e'; ctx.font = '10px monospace';
    ctx.fillText(kgs[i], x(i), H - 4);
  }
  ctx.fillText('KGs', W / 2, H - 4);

  // --- OOB seed spread band (yellow) ---
  if (hasSpread) {
    ctx.fillStyle = 'rgba(210,153,34,0.10)';
    ctx.beginPath();
    curve.forEach((_, i) => { i === 0 ? ctx.moveTo(x(i), y(oobMaxs[i])) : ctx.lineTo(x(i), y(oobMaxs[i])); });
    for (let i = curve.length - 1; i >= 0; i--) ctx.lineTo(x(i), y(oobMins[i]));
    ctx.closePath(); ctx.fill();
    // OOB seed dots
    ctx.fillStyle = 'rgba(210,153,34,0.30)';
    curve.forEach((r, i) => {
      (r.oob_all || []).forEach(o => {
        ctx.beginPath(); ctx.arc(x(i), y(o), 1.5, 0, Math.PI * 2); ctx.fill();
      });
    });
  }

  // --- Composite seed spread band (green) ---
  if (hasSpread) {
    ctx.fillStyle = 'rgba(63,185,80,0.12)';
    ctx.beginPath();
    curve.forEach((_, i) => { i === 0 ? ctx.moveTo(x(i), y(compMaxs[i])) : ctx.lineTo(x(i), y(compMaxs[i])); });
    for (let i = curve.length - 1; i >= 0; i--) ctx.lineTo(x(i), y(compMins[i]));
    ctx.closePath(); ctx.fill();
    // Composite seed dots
    ctx.fillStyle = 'rgba(63,185,80,0.30)';
    curve.forEach((r, i) => {
      (r.composite_all || []).forEach(c => {
        ctx.beginPath(); ctx.arc(x(i), y(c), 1.5, 0, Math.PI * 2); ctx.fill();
      });
    });
  }

  // Key points (based on composite median at max class count)
  const maxClsChart = Math.max(...curve.map(r => r.n_classes || 0));
  const matureComps = compMeds.map((c, i) => (curve[i].n_classes || 0) >= maxClsChart ? c : -1);
  const bestIdx = matureComps.indexOf(Math.max(...matureComps));
  const halfIdx = Math.floor(curve.length * 0.3);
  const secondHalf = compMeds.slice(halfIdx);
  const troughVal = secondHalf.length ? Math.min(...secondHalf) : compMeds[0];
  const troughIdx = halfIdx + secondHalf.indexOf(troughVal);

  // OOB median line (solid yellow)
  ctx.strokeStyle = '#d29922'; ctx.lineWidth = 2;
  ctx.beginPath();
  curve.forEach((_, i) => { i === 0 ? ctx.moveTo(x(i), y(oobMeds[i])) : ctx.lineTo(x(i), y(oobMeds[i])); });
  ctx.stroke();

  // Composite median line (solid green, main)
  ctx.strokeStyle = '#3fb950'; ctx.lineWidth = 2;
  ctx.beginPath();
  curve.forEach((_, i) => { i === 0 ? ctx.moveTo(x(i), y(compMeds[i])) : ctx.lineTo(x(i), y(compMeds[i])); });
  ctx.stroke();

  // Dots on composite median
  curve.forEach((_, i) => {
    ctx.beginPath(); ctx.arc(x(i), y(compMeds[i]), 3, 0, Math.PI * 2);
    if (i === bestIdx) { ctx.fillStyle = '#3fb950'; }
    else if (i === troughIdx && troughIdx !== bestIdx) { ctx.fillStyle = '#d29922'; }
    else { ctx.fillStyle = '#58a6ff'; }
    ctx.fill();
  });

  // Annotations
  ctx.font = '10px monospace'; ctx.textAlign = 'center';
  ctx.fillStyle = '#3fb950';
  ctx.fillText('comp ' + (compMeds[bestIdx]*100).toFixed(2) + '% / OOB ' + (oobMeds[bestIdx]*100).toFixed(2) + '% @ ' + kgs[bestIdx] + ' KGs',
    x(bestIdx), y(compMaxs[bestIdx]) - 10);
  if (troughIdx !== bestIdx) {
    ctx.fillStyle = '#d29922';
    ctx.fillText('Trough: ' + (compMeds[troughIdx]*100).toFixed(2) + '%', x(troughIdx), y(compMins[troughIdx]) + 16);
  }

  // Class change markers
  let prevCls = curve[0].n_classes;
  curve.forEach((r, i) => {
    if (r.n_classes > prevCls) {
      ctx.strokeStyle = '#bc8cff44'; ctx.lineWidth = 1; ctx.setLineDash([3,3]);
      ctx.beginPath(); ctx.moveTo(x(i), pad.top); ctx.lineTo(x(i), H - pad.bottom); ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = '#bc8cff'; ctx.font = '9px monospace';
      ctx.fillText('+cls\u2192' + r.n_classes, x(i) + 2, pad.top + 10);
    }
    prevCls = r.n_classes;
  });

  // Legend
  const lx = W - pad.right - 180, ly = pad.top + 8;
  ctx.font = '9px monospace'; ctx.textAlign = 'left';
  // Composite
  ctx.strokeStyle = '#3fb950'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(lx, ly + 5); ctx.lineTo(lx + 12, ly + 5); ctx.stroke();
  ctx.fillStyle = '#8b949e'; ctx.fillText('composite median', lx + 16, ly + 9);
  // OOB
  ctx.strokeStyle = '#d29922'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(lx, ly + 20); ctx.lineTo(lx + 12, ly + 20); ctx.stroke();
  ctx.fillStyle = '#8b949e'; ctx.fillText('OOB median', lx + 16, ly + 24);
  if (hasSpread) {
    // Composite band
    ctx.fillStyle = 'rgba(63,185,80,0.20)'; ctx.fillRect(lx, ly + 31, 12, 8);
    ctx.fillStyle = '#8b949e'; ctx.fillText('composite seed range', lx + 16, ly + 39);
    // OOB band
    ctx.fillStyle = 'rgba(210,153,34,0.18)'; ctx.fillRect(lx, ly + 46, 12, 8);
    ctx.fillStyle = '#8b949e'; ctx.fillText('OOB seed range', lx + 16, ly + 54);
  }
}

// Global: detail data from API
let curveDetailData = {};
let expandedKgs = null;

const ALL_TYPES = [
  'tree','shrub','grass','hedge','water','roof','greenhouse','solar_panel','fence','wall','mast',
  'wind_turbine','substation',
  'road','path','parking','bridge','crop','orchard','vineyard','garden','bare_soil','rock',
  'earthwork','excavation','fill','tree_loss','construction'
];
const TYPE_GROUPS = {
  'Vegetation': ['tree','shrub','grass','hedge','garden','orchard','vineyard','crop'],
  'Water': ['water'],
  'Buildings & Structures': ['roof','greenhouse','solar_panel','fence','wall','mast','wind_turbine','substation'],
  'Transport': ['road','path','parking','bridge'],
  'Terrain': ['bare_soil','rock','earthwork','excavation','fill'],
  'Change': ['tree_loss','construction'],
};

function tagCls(v) {
  if (v >= 0.85) return 't-great';
  if (v >= 0.60) return 't-good';
  if (v >= 0.35) return 't-ok';
  return 't-poor';
}

function buildDetailHTML(nKgs, colSpan) {
  const d = curveDetailData[String(nKgs)];
  if (!d) return `<td colspan="${colSpan}"><div class="not-evaluated">Detail not yet evaluated for ${nKgs} KGs — trigger curve eval to populate.</div></td>`;

  let h = `<td colspan="${colSpan}"><div class="dp">`;

  // Meta line with composite breakdown
  const compStr = d.composite != null ? ` · composite <b>${(d.composite*100).toFixed(2)}%</b>` : '';
  const meanClsStr = d.mean_class_oob != null ? ` · mean cls <b>${(d.mean_class_oob*100).toFixed(1)}%</b>` : '';
  const minClsStr = d.min_class_oob != null ? ` · worst cls <b>${(d.min_class_oob*100).toFixed(1)}%</b>` : '';
  h += `<div class="dp-meta"><b>${d.n_estimators}</b> trees · depth <b>${d.max_depth}</b> · min leaf <b>${d.min_samples_leaf}</b> · <b>${d.n_seeds}</b> seed${d.n_seeds>1?'s':''}${compStr}${meanClsStr}${minClsStr}</div>`;

  // Per-class OOB as tags grouped by category
  const classOob = d.per_class_oob || {};
  const present = new Set(d.classes_present || []);
  for (const [groupName, types] of Object.entries(TYPE_GROUPS)) {
    h += `<div class="dp-section">${groupName}</div><div class="tags">`;
    for (const t of types) {
      const val = classOob[t];
      if (val !== undefined) {
        const p = (val * 100).toFixed(0);
        h += `<span class="tag ${tagCls(val)}">${t} <span class="tv">${p}%</span></span>`;
      } else {
        h += `<span class="tag t-miss">${t}</span>`;
      }
    }
    h += `</div>`;
  }

  // Feature importances as compact text
  const imps = d.feature_importances || {};
  const sorted = Object.entries(imps).sort((a, b) => b[1] - a[1]);
  if (sorted.length > 0) {
    h += `<div class="dp-section">Top Features</div><div class="imps">`;
    const top = sorted.slice(0, 15);
    h += top.map(([k, v]) =>
      `<span class="fi">${k}</span> <span class="fv">${(v*100).toFixed(1)}%</span>`
    ).join(' · ');
    h += `</div>`;
  }

  h += `</div></td>`;
  return h;
}

function toggleDetail(nKgs, row) {
  const tbody = document.querySelector('#curveTable tbody');
  const colSpan = document.querySelector('#curveTable thead tr').children.length;

  // Close existing detail row if any
  const existingDetail = tbody.querySelector('tr.detail-row');
  const existingExpanded = tbody.querySelector('tr.curve-row.expanded');
  if (existingExpanded) existingExpanded.classList.remove('expanded');
  if (existingDetail) {
    const wasKgs = existingDetail.dataset.kgs;
    existingDetail.remove();
    if (String(wasKgs) === String(nKgs)) {
      expandedKgs = null;
      return; // toggle off
    }
  }

  // Insert new detail row after the clicked row
  row.classList.add('expanded');
  const detailTr = document.createElement('tr');
  detailTr.className = 'detail-row';
  detailTr.dataset.kgs = nKgs;
  detailTr.innerHTML = buildDetailHTML(nKgs, colSpan);
  row.insertAdjacentElement('afterend', detailTr);
  expandedKgs = nKgs;
}

function renderCurveTable(curve) {
  if (!curve || curve.length === 0) return;
  const tbody = document.querySelector('#curveTable tbody');
  const medians = curve.map(r => r.oob_median ?? r.oob ?? 0);
  const composites = curve.map(r => r.composite_median ?? r.oob_median ?? r.oob ?? 0);
  const maxCls = Math.max(...curve.map(r => r.n_classes || 0));
  // BEST = highest composite median at max class count
  const matureComps = curve.map(r => (r.n_classes || 0) >= maxCls ? (r.composite_median ?? r.oob_median ?? r.oob ?? 0) : -1);
  const bestComp = Math.max(...matureComps);
  const halfIdx = Math.floor(curve.length * 0.3);
  const secondHalf = composites.slice(halfIdx);
  const troughComp = secondHalf.length > 0 ? Math.min(...secondHalf) : -1;
  const hasSeeds = curve.some(r => (r.n_seeds || 1) > 1);

  // Update header
  const thead = document.querySelector('#curveTable thead tr');
  if (hasSeeds) thead.innerHTML = '<th>KGs</th><th>Samples</th><th>Cls</th><th>OOB (median)</th><th>Composite</th><th>Avg/Worst cls</th><th>Range</th><th>Seeds</th><th></th>';
  else thead.innerHTML = '<th>KGs</th><th>Samples</th><th>Cls</th><th>OOB</th><th>Composite</th><th></th>';

  let prevCls = 0;
  let prevComp = null;
  let html = '';
  curve.forEach((r, idx) => {
    const med = r.oob_median ?? r.oob ?? 0;
    const comp = composites[idx];
    const lo = r.oob_min ?? med;
    const hi = r.oob_max ?? med;
    const seeds = r.n_seeds || 1;
    const meanCls = r.mean_class_median;
    const minCls = r.min_class_median;
    let cls = '';
    let ann = '';
    if (r.n_classes > prevCls && prevCls > 0) { ann += '\u2190 +class\u2192' + r.n_classes; }
    const isDeployed = (_deployedModel.n_kgs === r.n_kgs);
    if (comp === bestComp && (r.n_classes || 0) >= maxCls) { cls = 'best'; ann = '\u2190 BEST' + (ann ? ' ' + ann : ''); }
    else if (comp === troughComp && r.n_kgs > curve[0].n_kgs) { cls = 'trough'; ann = '\u2190 trough' + (ann ? ' ' + ann : ''); }
    if (prevComp !== null && comp > prevComp + 0.002 && r.n_kgs > 30) { ann += (ann ? ' ' : '') + '\u2191'; }
    if (prevComp !== null && comp < prevComp - 0.002) { ann += (ann ? ' ' : '') + '\u2193'; }

    const barW = Math.max(5, ((comp - 0.50) / 0.30) * 100);
    const barColor = cls === 'best' ? 'var(--green)' : cls === 'trough' ? 'var(--yellow)' : 'var(--blue)';
    const spread = (hi - lo) * 100;
    const expandedCls = (expandedKgs === r.n_kgs) ? ' expanded' : '';

    html += `<tr class="curve-row ${cls}${expandedCls}" data-kgs="${r.n_kgs}">`;
    html += `<td>${r.n_kgs}</td>`;
    html += `<td>${r.n_samples.toLocaleString()}</td>`;
    html += `<td>${r.n_classes}</td>`;
    html += `<td>${(med * 100).toFixed(2)}%</td>`;
    html += `<td><span class="oob-bar" style="width:${barW}px;background:${barColor}"></span>${(comp * 100).toFixed(2)}%</td>`;
    if (hasSeeds) {
      const clsDetail = meanCls != null ? `${(meanCls*100).toFixed(1)}% / ${minCls != null ? (minCls*100).toFixed(1)+'%' : '\u2014'}` : '\u2014';
      html += `<td style="color:var(--dim);font-size:11px">${clsDetail}</td>`;
      html += `<td style="color:var(--dim);font-size:11px">${spread > 0 ? '\u00b1' + (spread/2).toFixed(2) + '%' : '\u2014'}</td>`;
      const target = r.n_kgs <= 30 ? 5 : r.n_kgs <= 60 ? 3 : 1;
      const denom = seeds >= target ? seeds : target;
      html += `<td style="color:var(--dim);font-size:11px">${seeds}/${denom}</td>`;
    }
    const starHtml = isDeployed ? ' <span class="deployed-star" title="Deployed model (seed ' + _deployedModel.best_seed + ', composite ' + (_deployedModel.composite*100).toFixed(2) + '%)" onclick="event.stopPropagation();showDeployedModal()" style="cursor:pointer">⭐</span>' : '';
    html += `<td><span class="annotation">${ann}${starHtml}</span></td></tr>`;

    // Re-insert detail row if this was expanded
    if (expandedKgs === r.n_kgs) {
      const colSpan = hasSeeds ? 9 : 6;
      html += `<tr class="detail-row" data-kgs="${r.n_kgs}">${buildDetailHTML(r.n_kgs, colSpan)}</tr>`;
    }

    prevCls = r.n_classes;
    prevComp = comp;
  });
  tbody.innerHTML = html;

  // Attach click handlers to curve rows
  tbody.querySelectorAll('tr.curve-row').forEach(tr => {
    tr.addEventListener('click', () => {
      const kgs = parseInt(tr.dataset.kgs);
      toggleDetail(kgs, tr);
    });
  });
}

function renderHistory(history) {
  if (!history || history.length === 0) { document.getElementById('historySection').style.display = 'none'; return; }
  document.getElementById('historySection').style.display = '';
  const tbody = document.querySelector('#histTable tbody');
  let html = '';
  history.forEach(r => {
    const statusCls = r.status ? 'status-' + r.status : '';
    const delta = r.delta_oob ? parseFloat(r.delta_oob) : 0;
    const deltaStr = delta > 0 ? '+' + (delta * 100).toFixed(2) + '%' : (delta * 100).toFixed(2) + '%';
    const deltaCls = delta > 0 ? 'status-improving' : delta < -0.005 ? 'status-declining' : '';
    html += `<tr>
      <td>${r.trained_at || r.timestamp}</td>
      <td>${r.n_kgs}</td>
      <td>${(parseFloat(r.oob) * 100).toFixed(2)}%</td>
      <td class="${deltaCls}">${deltaStr}</td>
      <td>${r.rolling_avg_5 ? (parseFloat(r.rolling_avg_5) * 100).toFixed(2) + '%' : '—'}</td>
      <td class="${statusCls}">${r.status || '—'}</td>
    </tr>`;
  });
  tbody.innerHTML = html;
}

function showDeployedModal() {
  const d = _deployedDetail;
  if (!d) { alert('Deployed model detail not yet available — run curve eval first.'); return; }
  const sub = document.getElementById('deployedModalSub');
  sub.textContent = `${d.n_kgs} KGs · seed ${d.seed} · ${(d.n_samples||0).toLocaleString()} samples · ${d.n_classes} classes · trained at ${_deployedModel.trained_at || '—'}`;

  let h = '';
  // Meta
  h += `<div class="dp-meta">`;
  h += `<b>${d.n_estimators}</b> trees · depth <b>${d.max_depth}</b> · min leaf <b>${d.min_samples_leaf}</b>`;
  h += ` · composite <b>${(d.composite*100).toFixed(2)}%</b>`;
  h += ` · OOB <b>${(d.oob*100).toFixed(2)}%</b>`;
  h += ` · mean cls <b>${(d.mean_class_oob*100).toFixed(1)}%</b>`;
  h += ` · worst cls <b>${(d.min_class_oob*100).toFixed(1)}%</b>`;
  h += `</div>`;

  // Per-class OOB by group
  const classOob = d.per_class_oob || {};
  for (const [groupName, types] of Object.entries(TYPE_GROUPS)) {
    h += `<div class="dp-section">${groupName}</div><div class="tags">`;
    for (const t of types) {
      const val = classOob[t];
      if (val !== undefined) {
        h += `<span class="tag ${tagCls(val)}">${t} <span class="tv">${(val*100).toFixed(0)}%</span></span>`;
      } else {
        h += `<span class="tag t-miss">${t}</span>`;
      }
    }
    h += `</div>`;
  }

  // Feature importances
  const imps = d.feature_importances || {};
  const sorted = Object.entries(imps).sort((a, b) => b[1] - a[1]);
  if (sorted.length > 0) {
    h += `<div class="dp-section">Top Features</div><div class="imps">`;
    h += sorted.slice(0, 20).map(([k, v]) =>
      `<span class="fi">${k}</span> <span class="fv">${(v*100).toFixed(1)}%</span>`
    ).join(' · ');
    h += `</div>`;
  }

  document.getElementById('deployedModalBody').innerHTML = h;
  document.getElementById('deployedModal').classList.add('open');
}

async function poll() {
  try {
    const r = await fetch(API);
    const d = await r.json();
    computeBestFromCurve(d.oob_curve);
    if (d.model) {
      _deployedModel = { n_kgs: d.model.n_kgs, best_seed: d.model.best_seed, composite: d.model.composite_score };
    }
    if (d.deployed_detail) _deployedDetail = d.deployed_detail;
    renderCards(d);
    renderChart(d.oob_curve);
    // Store curve_detail before rendering table
    if (d.curve_detail) curveDetailData = d.curve_detail;
    renderCurveTable(d.oob_curve);
    renderHistory(d.oob_history);
    document.getElementById('lastUpdate').textContent = new Date().toLocaleTimeString();
  } catch(e) {
    console.error('Poll error:', e);
  }
}

async function triggerEval(e) {
  e.preventDefault();
  const el = document.getElementById('triggerEval');
  if (el.dataset.busy === '1') return;
  try {
    el.textContent = 'starting…'; el.dataset.busy = '1';
    const r = await fetch('/api/v1/training/evaluate', {method:'POST'});
    if (r.status === 409) { setEvalState({running:true}); }
    else { setEvalState({running:true}); }
  } catch(e) { el.textContent = 'error'; el.style.color = 'var(--red)'; el.dataset.busy = '0'; }
}

function setEvalState(data) {
  const el = document.getElementById('triggerEval');
  const stopEl = document.getElementById('stopEval');
  const running = data.running;
  if (running) {
    let label = 'evaluating';
    if (data.total) {
      if (data.current_kgs) { const t = data.current_kgs <= 30 ? 5 : data.current_kgs <= 60 ? 3 : 1; label += ` ${data.current_kgs} KGs (seed ${+data.current_seed+1}/${t})`; }
      else label += ` ${data.done}/${data.total}`;
    }
    el.textContent = label; el.style.color = 'var(--green)';
    el.style.pointerEvents = 'none'; el.dataset.busy = '1';
    stopEl.style.display = '';
  } else {
    el.textContent = 'trigger now'; el.style.color = 'var(--blue)';
    el.style.pointerEvents = ''; el.dataset.busy = '0';
    stopEl.style.display = 'none';
  }
}

async function stopEval(e) {
  e.preventDefault();
  try {
    await fetch('/api/v1/training/evaluate/stop', {method:'POST'});
    checkEvalRunning();
  } catch(e) {}
}

async function checkEvalRunning() {
  try {
    const r = await fetch('/api/v1/training/evaluate');
    const d = await r.json();
    setEvalState(d);
  } catch(e) {}
}

function updateNextCron() {
  const now = new Date();
  const utcH = now.getUTCHours(), utcM = now.getUTCMinutes();
  const mins = utcH * 60 + utcM;
  // Cron runs every hour at :00
  let diff = 60 - utcM;
  if (diff <= 0) diff = 60;
  const h = Math.floor(diff / 60), m = diff % 60;
  const label = h > 0 ? `${h}h ${m}m` : `${m}m`;
  document.getElementById('nextCron').textContent = label;
}
updateNextCron();
setInterval(updateNextCron, 60000);

poll();
checkEvalRunning();
setInterval(poll, 15000);
setInterval(checkEvalRunning, 15000);
setInterval(() => {
  countdown--;
  if (countdown <= 0) countdown = 15;
  document.getElementById('pollCountdown').textContent = countdown;
}, 1000);
</script>
